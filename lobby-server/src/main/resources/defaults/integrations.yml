# =====================================================================
#  Integrations - everything here is optional and disabled by default.
#  Changes in this file need a full server restart.
#  Setup guides: see the docs/ folder on GitHub.
# =====================================================================

# ---------------- Database ----------------
# One MariaDB/MySQL connection shared by every integration below.
# Point it at the SAME database your LuckPerms, LiteBans and SkinsRestorer use.
# It is only used if at least one database integration is enabled.
database:
  host: "localhost"
  port: 3306
  database: "minecraft"
  username: "root"
  password: ""
  # How many connections to keep open (1-50). 4 is plenty for a lobby.
  pool-size: 4

# ---------------- LuckPerms ----------------
# Permissions, ranks, prefixes and suffixes from LuckPerms.
# Reads the tables starting with "luckperms_" in the database above.
# Rank changes made on the proxy or other servers apply here live.
# When disabled, the "operators" list in config.yml is used instead.
luckperms:
  enabled: false
  # This server's name for LuckPerms server-specific permissions (the "server" context).
  server-name: "lobby"
  # Table prefix. Must match "table-prefix" in your other LuckPerms configs.
  table-prefix: "luckperms_"
  # How rank changes reach this server. Must match "messaging-service" in your other LuckPerms configs.
  #   sql       - through the database (recommended, works even when nobody is online)
  #   pluginmsg - through the proxy (needs at least one player on this lobby)
  messaging-service: "sql"

# ---------------- LiteBans ----------------
# Reads bans and mutes from LiteBans tables (read only, never writes).
#   - In standalone mode, banned players cannot join.
#   - In every mode, muted players are known to the chat system.
litebans:
  enabled: false
  # Table prefix. Must match "table_prefix" in your LiteBans config.
  table-prefix: "litebans_"
  # Global bans and mutes always apply. Punishments limited to one server ("server scope")
  # only apply here if their server name matches this one.
  server-name: "lobby"
  # How often to check for new mutes, in seconds (1-60).
  check-interval: 3

# ---------------- SkinsRestorer ----------------
# Reads skins stored by SkinsRestorer (read only).
# Not needed for players' own skins behind a proxy - the proxy already sends them.
# Used later for NPC skins.
skinsrestorer:
  enabled: false
  # Table prefix. Must match "tablePrefix" in your SkinsRestorer config.
  table-prefix: "sr_"

# ---------------- MineSkin ----------------
# NPC skins from https://mineskin.org. Skins already on MineSkin (a mineskin.org link or
# mineskin:<uuid>) work without a key. Turning a link to a skin image (a .png) into a skin needs an
# API key from https://mineskin.org/apikey. Keep it secret: anyone with it can use your MineSkin quota.
mineskin:
  api-key: ""

# ---------------- SignedVelocity ----------------
# Install SignedVelocity on your Velocity proxy and turn this on, so chat messages and commands that
# proxy plugins cancel or change (for example LiteBans mutes on Velocity) are cancelled or changed here too.
# Only works when mode is "velocity". https://modrinth.com/plugin/signedvelocity
signedvelocity:
  enabled: false

# ---------------- Bridge ----------------
# Receives information from the lobby-bridge plugin on your Velocity proxy
# (real client versions, player counts of other servers).
# Only works when mode is "velocity" or "bungeecord" in config.yml.
bridge:
  enabled: false

# ---------------- ItemsAdder ----------------
# Loads custom items and font images (glyphs, emojis, custom GUI textures, offsets) from an
# ItemsAdder folder (contents/ + storage/ cache files) and/or a generated resource pack (.zip),
# and sends the resource pack to players on join.
# Changes in this section apply live with /setup-lobby reload.
# Guide: docs/integrations/itemsadder.md
itemsadder:
  enabled: false
  # Path to a copied ItemsAdder folder (containing contents/ and/or storage/), relative to the
  # server folder or absolute. Leave empty to only read pack-zip.
  data-path: "itemsadder"
  # Optional path to a generated ItemsAdder resource pack (.zip), relative to the server folder or
  # absolute. If left empty and <data-path>/output/generated.zip exists, it is read automatically.
  pack-zip: ""
  resource-pack:
    # Public HTTP/HTTPS URL of your hosted ItemsAdder resource pack (CDN or web server).
    # Leave empty if your proxy already sends the resource pack.
    url: ""
    # Optional 40-character SHA-1 hex hash of the pack zip.
    # Leave empty to auto-compute from pack-zip (if present), or skip hash checking.
    hash: ""
    # True to require the pack (players who decline or fail download are kicked).
    required: false
    # Message shown on the client's resource-pack prompt (MiniMessage). Leave empty for no prompt.
    prompt: "<gold>This server uses a custom resource pack."
    # Kick message when required is true and the player declines or download fails.
    kick-message: "<red>You must accept the server resource pack to play here."
    # Clear previously applied resource packs before applying this one.
    replace: false
  chat:
    # Replace :glyph: and :namespace:glyph: shortcodes in player chat messages.
    replace-glyphs: true
    # Permission needed to use ItemsAdder glyphs in chat ("" = everyone who can use chat emojis).
    glyph-permission: ""

# ---------------- Simple Voice Chat ----------------
# Built-in Simple Voice Chat server (supports both 2.5.x protocol v18 and 2.6.x protocol v21).
# Open the UDP port below in your firewall so clients can connect.
voicechat:
  enabled: false
  # Address to bind the UDP socket to ("0.0.0.0" = all interfaces).
  bind-address: "0.0.0.0"
  # UDP port for voice traffic (default 24454).
  port: 24454
  # Optional public host/IP (or "host:port") sent to clients if different from the Minecraft address.
  # Leave empty to let clients use the same host they connected to Minecraft with.
  voice-host: ""
  # Maximum proximity voice distance in blocks (4-256).
  max-distance: 48.0
  # Whisper distance in blocks (2-128).
  whisper-distance: 24.0
  # Opus codec preset: voip, audio or restricted_lowdelay.
  codec: "voip"
  # Maximum UDP packet payload size (256-1024).
  mtu-size: 1024
  # Keep-alive interval in milliseconds (1000-10000).
  keep-alive: 1000
  # Allow clients to record audio locally.
  allow-recording: true
  # Block LiteBans-muted players from speaking.
  respect-mutes: true

# ---------------- badcoreSettings ----------------
# Cross-server player settings GUI (/settings, /prefs, /options) synced with Velocity
# (plugin messaging channel "badcore:settings") and MariaDB (QOA + Practice/Duels tables).
# Changes in this section apply live with /setup-lobby reload or /settings reload.
badcore-settings:
  enabled: false
  # Cooldown between setting toggles in milliseconds (0 = no cooldown).
  cooldown-ms: 500
  # Command executed when clicking Scoreboard in Gens Settings (without leading '/').
  scoreboard-command: "sb"
  # MariaDB connection for QOA, Practice, TabView, and ChatColor settings.
  # Set database.enabled to false to rely only on Velocity plugin-message sync.
  database:
    enabled: true
    host: "localhost"
    port: 3306
    database: "badcore_practice"
    username: "root"
    password: ""
    pool-size: 6
    connection-timeout-ms: 5000
    use-ssl: false
    qoa-table: "badcore_qoa_settings"
  messages:
    player-only: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>This command can only be used by players.</#CF8484>"
    no-permission: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>You do not have permission to use this command.</#CF8484>"
    vip-required: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>This setting requires a VIP rank.</#CF8484>"
    cooldown: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>Please wait <white><seconds>s</white> before changing this again.</#CF8484>"
    reloaded: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#8ECF84>Settings configuration reloaded.</#8ECF84>"
    dbtest-running: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#DDDDDD>Testing MariaDB connection...</#DDDDDD>"
    dbtest-ok: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#8ECF84>MariaDB OK (<white><target></white>, <white><version></white>, <white><latency>ms</white>).</#8ECF84>"
    dbtest-fail: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>MariaDB failed (<white><target></white>, <white><latency>ms</white>): <white><error></white></#CF8484>"
    sync-running: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#DDDDDD>Syncing ChatColors & TabView...</#DDDDDD>"
    sync-pushed: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#8ECF84>Synced <white><chatcolors></white> chat colors and <white><tabview></white> tab view entries to MariaDB.</#8ECF84>"
    sync-pulled: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#8ECF84>Loaded <white><chatcolors></white> chat colors and <white><tabview></white> tab view entries from MariaDB.</#8ECF84>"
    sync-fail: "<white><bold>ꜱᴇʀᴠᴇʀ →</bold></white> <#CF8484>Sync failed: <white><error></white></#CF8484>"
    vip:
      label: "VIP"
      badge: " &7%vip%"
  tabview:
    items:
      pv:
        name: "Player Vault"
        material: "CHEST"
        permission: "axvaults.vault.1"
        default_enabled: true
      og:
        name: "OG Tag"
        material: "NAME_TAG"
        permission: "badcore.tabview.og"
        default_enabled: false
      winter:
        name: "Winter Tag"
        material: "SNOWBALL"
        permission: "badcore.tabview.winter"
        default_enabled: false
      booster:
        name: "Booster Tag"
        material: "AMETHYST_SHARD"
        permission: "badcore.tabview.booster"
        default_enabled: false
  chatcolors:
    fire:
      name: "Fire"
      material: "CREEPER_BANNER_PATTERN"
      permission: "badcore.chatcolor.fire"
    ice:
      name: "Ice"
      material: "GUSTER_BANNER_PATTERN"
      permission: "badcore.chatcolor.ice"
    toxic:
      name: "Toxic"
      material: "FLOW_BANNER_PATTERN"
      permission: "badcore.chatcolor.toxic"
    amethyst:
      name: "Amethyst"
      material: "FLOWER_BANNER_PATTERN"
      permission: "badcore.chatcolor.amethyst"
    gold:
      name: "Gold"
      material: "MOJANG_BANNER_PATTERN"
      permission: "badcore.chatcolor.gold"

# ---------------- ModelEngine R4 ----------------
# Renders ModelEngine R4 .bbmodel blueprints on NPCs (/npc model <npc> <model_id>) using
# packet-only ItemDisplay bones, with idle animations, head tracking and click hitboxes.
# Automatically scans the merged ItemsAdder resource pack (itemsadder.pack-zip or
# <itemsadder.data-path>/output/generated.zip) to map bones to custom_model_data / item_model.
# Changes in this section apply live with /setup-lobby reload.
modelengine:
  enabled: false
  # Path to a copied ModelEngine folder (containing blueprints/ and optionally resource pack/).
  data-path: "modelengine"
  # Optional path to a standalone ModelEngine resource pack (.zip).
  # Leave empty if ModelEngine is already merged into your ItemsAdder resource pack.
  pack-zip: ""
  # Base item used for custom_model_data bone overrides when not detected from the pack.
  default-item: "leather_horse_armor"

# ---------------- MythicMobs ----------------
# Loads MythicMobs mob definitions (Mobs/*.yml) so you can spawn them as lobby NPCs
# with /npc mythic <name> <mob_id> (reads Type, Display, Options.Scale, Equipment and
# ModelEngine model{mid=...} skills).
# Changes in this section apply live with /setup-lobby reload.
mythicmobs:
  enabled: false
  # Path to a copied MythicMobs folder (containing Mobs/).
  data-path: "mythicmobs"
